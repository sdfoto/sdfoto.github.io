+(() => {
+  const itemsPerPage = 12;
+  const main = document.querySelector('#main');
+  const pagination = document.querySelector('#gallery-pagination');
+  if (!main || !pagination) return;
+
+  const thumbs = Array.from(main.querySelectorAll('article.thumb'));
+  const blankPixel = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==';
+
+  thumbs.forEach((thumb) => {
+    const img = thumb.querySelector('img');
+    if (!img) return;
+    const currentSrc = img.getAttribute('src');
+    if (!currentSrc) return;
+    img.dataset.src = currentSrc;
+    img.src = blankPixel;
+  });
+
+  const ensureThumbLoaded = (thumb) => {
+    const img = thumb.querySelector('img');
+    const imageLink = thumb.querySelector('a.image');
+    if (!img?.dataset.src || !imageLink) return;
+    if (img.dataset.loaded === 'true') return;
+
+    img.src = img.dataset.src;
+    imageLink.style.backgroundImage = `url(${img.dataset.src})`;
+    img.dataset.loaded = 'true';
+  };
+
+  if (thumbs.length <= itemsPerPage) {
+    thumbs.forEach((thumb, index) => {
+      const img = thumb.querySelector('img');
+      ensureThumbLoaded(thumb);
+      if (img) img.loading = index < 6 ? 'eager' : 'lazy';
+    });
+    pagination.hidden = true;
+    return;
+  }
+
+  const totalPages = Math.ceil(thumbs.length / itemsPerPage);
+  let currentPage = 1;
+
+  const pageFromHash = Number.parseInt(window.location.hash.replace('#page-', ''), 10);
+  if (!Number.isNaN(pageFromHash) && pageFromHash >= 1 && pageFromHash <= totalPages) {
+    currentPage = pageFromHash;
+  }
+
+  const setPage = (page) => {
+    currentPage = page;
+    const start = (currentPage - 1) * itemsPerPage;
+    const end = start + itemsPerPage;
+
+    thumbs.forEach((thumb, index) => {
+      const isVisible = index >= start && index < end;
+      thumb.style.display = isVisible ? '' : 'none';
+      const img = thumb.querySelector('img');
+      if (!img) return;
+      if (isVisible) ensureThumbLoaded(thumb);
+      img.loading = index < start + 6 ? 'eager' : 'lazy';
+    });
+
+    pagination.innerHTML = '';
+    const prevBtn = document.createElement('button');
+    prevBtn.type = 'button';
+    prevBtn.textContent = '← Anterior';
+    prevBtn.disabled = currentPage === 1;
+    prevBtn.addEventListener('click', () => setPage(currentPage - 1));
+    pagination.appendChild(prevBtn);
+
+    const indicator = document.createElement('span');
+    indicator.className = 'page-indicator';
+    indicator.textContent = `Página ${currentPage} de ${totalPages}`;
+    pagination.appendChild(indicator);
+
+    const nextBtn = document.createElement('button');
+    nextBtn.type = 'button';
+    nextBtn.textContent = 'Siguiente →';
+    nextBtn.disabled = currentPage === totalPages;
+    nextBtn.addEventListener('click', () => setPage(currentPage + 1));
+    pagination.appendChild(nextBtn);
+
+    for (let p = 1; p <= totalPages; p += 1) {
+      const pageBtn = document.createElement('button');
+      pageBtn.type = 'button';
+      pageBtn.textContent = String(p);
+      if (p === currentPage) pageBtn.classList.add('active');
+      pageBtn.addEventListener('click', () => setPage(p));
+      pagination.appendChild(pageBtn);
+    }
+
+    const desiredHash = `#page-${currentPage}`;
+    if (window.location.hash !== desiredHash) {
+      history.replaceState(null, '', desiredHash);
+    }
+    main.scrollIntoView({ behavior: 'smooth', block: 'start' });
+  };
+
+  window.addEventListener('hashchange', () => {
+    const page = Number.parseInt(window.location.hash.replace('#page-', ''), 10);
+    if (!Number.isNaN(page) && page >= 1 && page <= totalPages && page !== currentPage) {
+      setPage(page);
+    }
+  });
+
+  setPage(currentPage);
+})();
